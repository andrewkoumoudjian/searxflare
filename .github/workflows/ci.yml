name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          target: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install validators
        run: python3 -m pip install --disable-pip-version-check jsonschema openapi-spec-validator pyyaml
      - name: Install worker-build
        run: cargo install worker-build --version 0.8.5 --locked
      - name: Install JavaScript test tools
        run: npm install
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Wasm build
        run: cargo build --workspace --target wasm32-unknown-unknown
      - name: Validate OpenAPI and manifests
        run: npm run validate:specs
      - name: Workerd integration tests
        env:
          CLOUDFLARE_CF_FETCH_ENABLED: 'false'
        run: npm run test:worker
      - name: Wrangler dry-run bundle
        run: npm run bundle
      - name: Bundle size report
        run: npm run bundle:size | tee bundle-size.txt
      - name: Job summary
        run: |
          echo '## Bundle size' >> "$GITHUB_STEP_SUMMARY"
          cat bundle-size.txt >> "$GITHUB_STEP_SUMMARY"
