name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          target: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Restore worker-build cache
        id: worker-build-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-v0.8.5
      - name: Install worker-build
        if: steps.worker-build-cache.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.5 --locked
      - name: Save worker-build cache
        if: steps.worker-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-v0.8.5
      - name: Install validators
        run: python3 -m pip install --disable-pip-version-check jsonschema openapi-spec-validator pyyaml
      - name: Install JavaScript test tools
        run: npm ci
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics
          path: clippy.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce Clippy result
        if: steps.clippy.outputs.status != '0'
        run: exit 1
      - name: Rust tests
        run: cargo test --locked --workspace
      - name: Memory profile guard
        run: cargo run --locked -p metasearch-core --example memory_profile --release
      - name: Wasm build
        id: wasm-build
        shell: bash
        run: |
          set +e
          cargo build --locked --workspace --target wasm32-unknown-unknown 2>&1 | tee wasm-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Wasm build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build-diagnostics
          path: wasm-build.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce Wasm build result
        if: steps.wasm-build.outputs.status != '0'
        run: exit 1
      - name: Validate OpenAPI and manifests
        run: npm run validate:specs
      - name: Workerd integration tests
        id: workerd-tests
        shell: bash
        env:
          CLOUDFLARE_CF_FETCH_ENABLED: 'false'
        run: |
          set +e
          npm run test:worker 2>&1 | tee workerd-tests.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload workerd test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workerd-test-diagnostics
          path: workerd-tests.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce workerd test result
        if: steps.workerd-tests.outputs.status != '0'
        run: exit 1
      - name: Wrangler dry-run bundle
        run: npm run bundle
      - name: Bundle size report
        run: npm run bundle:size | tee bundle-size.txt
      - name: Job summary
        run: |
          echo '## Bundle size' >> "$GITHUB_STEP_SUMMARY"
          cat bundle-size.txt >> "$GITHUB_STEP_SUMMARY"
