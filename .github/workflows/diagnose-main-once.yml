name: Diagnose Main Once

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Publish run ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            --method POST \
            --field body="Main diagnostic run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} for commit ${GITHUB_SHA}."
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          target: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: worker-build-cache
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ runner.os }}-rust-1.97.1-v0.8.5
      - run: python3 -m pip install --disable-pip-version-check jsonschema openapi-spec-validator pyyaml
      - if: steps.worker-build-cache.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.5 --locked
      - run: npm install
      - name: Run all diagnostics
        id: diagnostics
        continue-on-error: true
        run: bash scripts/diagnose_main_once.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-diagnostics
          path: main-diagnostics.log
          if-no-files-found: error
          retention-days: 3
      - if: steps.diagnostics.outcome != 'success'
        run: exit 1
