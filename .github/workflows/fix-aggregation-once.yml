name: Fix Aggregation Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: python3 scripts/fix_aggregation_once.py
      - run: cargo fmt --all
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/metasearch-worker/src/runtime.rs tests/integration/worker.spec.js
          git commit -m 'fix: distinguish empty success from provider failure'
          git push origin HEAD:main
