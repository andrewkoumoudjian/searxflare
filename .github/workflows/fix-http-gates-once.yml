name: Fix HTTP Target Gates Once

on:
  push:
    branches: [feat/worker-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/worker-foundation
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Gate Wasm-only transport helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/metasearch-http/src/lib.rs')
          source = path.read_text()
          source = source.replace(
              '    BoundedResponse, Deadline, EngineDescriptor, EngineFailure, EngineHttpClient, EngineMethod,\n    EngineRequest, FailureKind,\n',
              '    BoundedResponse, Deadline, EngineDescriptor, EngineFailure, EngineHttpClient, EngineRequest,\n    FailureKind,\n',
          )
          source = source.replace('use std::collections::BTreeMap;\n', '')
          source = source.replace(
              'const SENSITIVE_HEADERS: &[&str] = &["authorization", "cookie", "proxy-authorization"];\n\n',
              '',
          )
          source = source.replace(
              '\nfn content_type_matches(actual: Option<&str>, accepted: &[&str]) -> bool {',
              '\n#[cfg(any(target_arch = "wasm32", test))]\nfn content_type_matches(actual: Option<&str>, accepted: &[&str]) -> bool {',
          )
          source = source.replace(
              '\nfn strip_sensitive_headers(headers: &mut BTreeMap<String, String>) {\n    headers.retain(|name, _| {\n        !SENSITIVE_HEADERS\n            .iter()\n            .any(|sensitive| name.eq_ignore_ascii_case(sensitive))\n    });\n}\n',
              '',
          )
          source = source.replace(
              '    use js_sys::Uint8Array;\n    use std::time::Duration;\n',
              '    use js_sys::Uint8Array;\n    use metasearch_core::EngineMethod;\n    use std::{collections::BTreeMap, time::Duration};\n\n    const SENSITIVE_HEADERS: &[&str] = &["authorization", "cookie", "proxy-authorization"];\n\n    fn strip_sensitive_headers(headers: &mut BTreeMap<String, String>) {\n        headers.retain(|name, _| {\n            !SENSITIVE_HEADERS\n                .iter()\n                .any(|sensitive| name.eq_ignore_ascii_case(sensitive))\n        });\n    }\n',
          )
          path.write_text(source)
          PY
          cargo fmt --all
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/metasearch-http/src/lib.rs
          git commit -m 'fix: gate Worker transport helpers to wasm32'
          git push origin HEAD:feat/worker-foundation
