name: Fix Wasm Fetch Lifetime Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Bind the Worker fetch object for the future lifetime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/metasearch-http/src/lib.rs')
          source = path.read_text()
          old = '        let fetch = Fetch::Request(request).send_with_signal(&signal);\n'
          new = (
              '        let fetch_request = Fetch::Request(request);\n'
              '        let fetch = fetch_request.send_with_signal(&signal);\n'
          )
          if new in source:
              raise SystemExit(0)
          if source.count(old) != 1:
              raise SystemExit('expected exactly one temporary Fetch::Request binding')
          path.write_text(source.replace(old, new))
          PY
          cargo fmt --all
      - name: Commit the fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/metasearch-http/src/lib.rs
          git commit -m 'fix: retain Worker fetch object through deadline race'
          git push origin HEAD:main
