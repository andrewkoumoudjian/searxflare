name: Lock Dependencies Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          target: wasm32-unknown-unknown
      - name: Generate lockfiles
        run: |
          cargo generate-lockfile
          npm install --package-lock-only --ignore-scripts
      - name: Validate lockfiles
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json || true
      - name: Commit lockfiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: lock Rust and JavaScript dependencies'
          git push origin HEAD:main
