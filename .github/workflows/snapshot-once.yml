name: Snapshot Branch Once

on:
  push:
    branches: [feat/worker-foundation]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/worker-foundation
      - name: Create sanitized source snapshot
        run: |
          tar --exclude=.git --exclude=target --exclude=node_modules --exclude=.dev.vars --exclude=.wrangler -czf /tmp/searxflare-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: searxflare-source
          path: /tmp/searxflare-source.tgz
          if-no-files-found: error
          retention-days: 1
