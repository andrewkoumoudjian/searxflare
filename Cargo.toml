[workspace]
resolver = "2"
members = [
  "crates/metasearch-worker",
  "crates/metasearch-api",
  "crates/metasearch-core",
  "crates/metasearch-http",
  "crates/metasearch-state",
  "crates/metasearch-parsers",
  "crates/metasearch-engines",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/andrewkoumoudjian/searxflare"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
futures-util = "0.3.31"
hmac = "0.12.1"
js-sys = "0.3.82"
lol_html = "3.0.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
subtle = "2.6.1"
unicode-normalization = "0.1.24"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "js"] }
wasm-bindgen = "0.2.105"
worker = "0.8.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
