[workspace]
resolver = "2"
members = [
  "crates/metasearch-api",
  "crates/metasearch-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/andrewkoumoudjian/searxflare"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
hmac = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
unicode-normalization = "0.1.24"
url = { version = "2.5.7", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
