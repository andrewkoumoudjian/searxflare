id: arxiv
display_name: arXiv
endpoint: https://export.arxiv.org/api/query
method: GET
categories: [academic]
source_kind: atom
allowed_hosts: [export.arxiv.org]
capabilities:
  paging: true
  locale: false
  country: false
  safe_search: false
  time_range: false
limits:
  timeout_ms: 2500
  max_body_bytes: 2097152
  max_steps: 3
  max_redirects: 2
versions:
  parser: arxiv-atom-v2
cache:
  response_ttl_seconds: 1800
  negative_ttl_seconds: 30
state: stateless
default_enabled: true
notes: Qualifies each whitespace-delimited term as an all-field phrase joined with AND, uses start=(page-1)*limit and max_results=limit, and explicitly surfaces Atom error entries before mapping paper metadata.
