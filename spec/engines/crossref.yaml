id: crossref
display_name: Crossref
endpoint: https://api.crossref.org/works
method: GET
categories: [academic]
source_kind: json
allowed_hosts: [api.crossref.org]
capabilities:
  paging: true
  locale: false
  country: false
  safe_search: false
  time_range: false
limits:
  timeout_ms: 2500
  max_body_bytes: 2097152
  max_steps: 3
  max_redirects: 2
versions:
  parser: crossref-works-json-v1
cache:
  response_ttl_seconds: 900
  negative_ttl_seconds: 30
state: stateless
default_enabled: true
notes: Uses the public Crossref REST works search with bounded rows and offset. It preserves DOI, authors, publication date, container, publisher and citation metadata, and strips upstream JATS markup from abstracts.
