id: duckduckgo-html
display_name: DuckDuckGo HTML
endpoint: https://html.duckduckgo.com/html/
method: POST
categories: [general]
source_kind: html
allowed_hosts: [html.duckduckgo.com, duckduckgo.com]
capabilities:
  paging: true
  locale: true
  country: false
  safe_search: true
  time_range: true
limits:
  timeout_ms: 3500
  max_body_bytes: 2097152
  max_steps: 3
  max_redirects: 2
versions:
  parser: duckduckgo-html-v1
cache:
  response_ttl_seconds: 180
  negative_ttl_seconds: 30
state: durable_coordinator
default_enabled: true
notes: No-JavaScript HTML form with signed public cursors carrying query-bound VQD continuation. Initialization is single-flight per query, provider cooldown is shared, and continuation state expires from KV. Redirect-wrapper decoding is internal and limited to DuckDuckGo /l URLs.
