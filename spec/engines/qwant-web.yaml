id: qwant-web
display_name: Qwant Web
endpoint: https://api.qwant.com/v3/search/web
method: GET
categories: [general]
source_kind: json
allowed_hosts: [api.qwant.com, www.qwant.com]
capabilities:
  paging: true
  locale: true
  country: true
  safe_search: true
  time_range: false
limits:
  timeout_ms: 2500
  max_body_bytes: 2097152
  max_steps: 3
  max_redirects: 2
versions:
  parser: qwant-web-json-v2
cache:
  response_ttl_seconds: 180
  negative_ttl_seconds: 30
state: stateless
default_enabled: true
notes: Uses the fixed public frontend JSON endpoint with the caller's smaller bounded result limit capped at ten, matching page offsets, locale, safe-search and explicit challenge or rate-limit classification. Cloudflare preview egress was challenged on 2026-07-25, so the provider remains explicit opt-in without bypass behavior.
