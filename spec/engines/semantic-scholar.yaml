id: semantic-scholar
display_name: Semantic Scholar
endpoint: https://api.semanticscholar.org/graph/v1/paper/search
method: GET
categories: [academic]
source_kind: json
allowed_hosts: [api.semanticscholar.org]
capabilities:
  paging: true
  locale: false
  country: false
  safe_search: false
  time_range: false
limits:
  timeout_ms: 2500
  max_body_bytes: 2097152
  max_steps: 3
  max_redirects: 2
versions:
  parser: semantic-scholar-paper-search-json-v1
cache:
  response_ttl_seconds: 900
  negative_ttl_seconds: 30
state: stateless
default_enabled: false
notes: Uses the public Semantic Scholar Academic Graph relevance search without requiring an API key. Results are capped to the provider's first 1000 relevance-ranked records, and shared unauthenticated rate limits remain an operational limitation.
