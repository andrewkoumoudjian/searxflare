id: semantic-scholar
display_name: Semantic Scholar
endpoint: https://www.semanticscholar.org/api/1/search
method: POST
categories: [academic]
source_kind: json
allowed_hosts: [www.semanticscholar.org]
capabilities:
  paging: true
  locale: false
  country: false
  safe_search: false
  time_range: false
limits:
  timeout_ms: 2500
  max_body_bytes: 2097152
  max_steps: 3
  max_redirects: 2
versions:
  parser: semantic-scholar-web-search-json-v2
cache:
  response_ttl_seconds: 900
  negative_ttl_seconds: 30
state: kv_snapshot
default_enabled: true
notes: Reads the current public UI version from the Semantic Scholar homepage, caches it for five minutes, and posts bounded relevance searches through the public web endpoint without an API key.
