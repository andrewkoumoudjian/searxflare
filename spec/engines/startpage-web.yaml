id: startpage-web
display_name: Startpage Web
endpoint: https://www.startpage.com/sp/search
method: POST
categories: [general]
source_kind: html
allowed_hosts: [www.startpage.com]
capabilities:
  paging: true
  locale: true
  country: false
  safe_search: true
  time_range: true
limits:
  timeout_ms: 3500
  max_body_bytes: 2097152
  max_steps: 3
  max_redirects: 2
versions:
  parser: startpage-web-html-v1
cache:
  response_ttl_seconds: 120
  negative_ttl_seconds: 60
state: durable_coordinator
default_enabled: false
notes: Experimental fixed-host adapter guarded by ENABLE_STARTPAGE, with shared cooldown and optional Web Bot Auth signing.
