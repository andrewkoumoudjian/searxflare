id: wikipedia
display_name: Wikipedia
endpoint: https://en.wikipedia.org/w/index.php
method: GET
categories: [reference]
source_kind: html
allowed_hosts: [en.wikipedia.org, fr.wikipedia.org, de.wikipedia.org, es.wikipedia.org]
capabilities:
  paging: true
  locale: true
  country: false
  safe_search: false
  time_range: false
limits:
  timeout_ms: 3500
  max_body_bytes: 2097152
  max_steps: 3
  max_redirects: 2
versions:
  parser: wikipedia-html-v1
cache:
  response_ttl_seconds: 1800
  negative_ttl_seconds: 30
state: stateless
default_enabled: true
notes: Uses Special:Search HTML with fulltext=1, ns0=1, limit=10 and numeric offset. Locale selection is restricted to the four compile-time hosts; unsupported locales fall back to English.
