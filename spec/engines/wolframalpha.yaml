id: wolframalpha
display_name: WolframAlpha
endpoint: https://api.wolframalpha.com/v2/query
method: GET
categories: [science]
source_kind: json
allowed_hosts: [api.wolframalpha.com]
capabilities:
  paging: false
  locale: false
  country: false
  safe_search: false
  time_range: false
limits:
  timeout_ms: 2500
  max_body_bytes: 2097152
  max_steps: 3
  max_redirects: 2
versions:
  parser: wolframalpha-v2-json-v1
cache:
  response_ttl_seconds: 900
  negative_ttl_seconds: 60
state: durable_coordinator
default_enabled: true
notes: Uses the official JSON Query API with WOLFRAM_APP_ID supplied through the provider-scoped secret boundary and shared provider cooldown.
