id: yandex-web
display_name: Yandex Web
endpoint: https://yandex.com/search/
method: GET
categories: [general]
source_kind: html
allowed_hosts: [yandex.com, www.yandex.com]
capabilities:
  paging: true
  locale: true
  country: false
  safe_search: false
  time_range: false
limits:
  timeout_ms: 3500
  max_body_bytes: 2097152
  max_steps: 3
  max_redirects: 2
versions:
  parser: yandex-web-html-v1
cache:
  response_ttl_seconds: 180
  negative_ttl_seconds: 30
state: stateless
default_enabled: true
notes: Uses the public HTML frontend with fixed hosts, zero-based bounded paging, language selection, streaming lol-html parsing, and explicit changed-layout detection. Default-disabled because challenge behavior from Cloudflare egress is not yet validated.
