[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "searxflare-linkedin-index"
version = "0.1.0"
description = "LinkedIn public-SSR crawl normalization and local hybrid index tooling for searxflare"
requires-python = ">=3.11,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "markdownify>=1.0,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "qdrant-client[fastembed]>=1.14.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]

